# 手动发行：Actions → Release → Run workflow
# 版本号取自仓库根目录 VERSION 文件，打 tag 为 v{VERSION}；
# 产物以 prerelease（预发布）状态发布，测试通过后手动改为正式版。
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: 生成更新日志并创建预发布（已存在则跳过，支持重跑）
        run: |
          TAG="v$VERSION"
          # 取最近一个已发布版本（排除当前要发的 tag），用于生成对比日志
          PREV="$(gh release list --limit 30 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1 || true)"
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          # 条目只保留提交信息正文，去掉 gitmoji 图标；图标仅用于分组大标题
          fmt() { sed -E 's/^[0-9a-f]{7,} //' | sed -E 's/^[^[:alnum:]]+[[:space:]]*//' | sed 's/^/- /'; }
          {
            echo "### ✨ 新增"
            git log --oneline --no-merges --grep='^✨' "$RANGE" | fmt
            echo
            echo "### 🐛 修复"
            git log --oneline --no-merges --grep='^🐛' "$RANGE" | fmt
            echo
            echo "### 🎨 界面与样式"
            git log --oneline --no-merges --grep='^🎨' "$RANGE" | fmt
            echo
            echo "### 👷 CI 与工具"
            git log --oneline --no-merges -E --grep='^(👷|🔧)' "$RANGE" | fmt
            echo
            echo "### 📝 文档"
            git log --oneline --no-merges --grep='^📝' "$RANGE" | fmt
          } > "$NOTES"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --notes-file "$NOTES" --target "$GITHUB_SHA"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            upload-globs: "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi"
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            upload-globs: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            upload-globs: "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup target add ${{ matrix.rust-target }}
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.rust-target }}
      - name: 上传产物到预发布
        run: gh release upload "v$VERSION" ${{ matrix.upload-globs }} --clobber
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
