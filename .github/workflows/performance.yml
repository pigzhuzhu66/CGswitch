name: Performance

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/performance.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store:
    name: 存储基准到缓存
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 恢复上次基准数据
        uses: actions/cache@v6
        with:
          path: .bench-cache
          key: cgswitch-bench-${{ runner.os }}
      - name: 运行热路径基准
        shell: bash
        working-directory: src-tauri
        run: cargo bench --bench config_bench -- --warm-up-time 1 --measurement-time 2 --output-format bencher --color never --noplot 2>&1 | tee output.txt
      - name: 存储并对比基准结果
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: cgswitch-core-hotpath
          tool: cargo
          output-file-path: src-tauri/output.txt
          external-data-json-path: .bench-cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '200%'
          fail-on-alert: false
          summary-always: true
          max-items-in-chart: 500

  compare:
    name: 对比基准并告警
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 恢复上次基准数据
        uses: actions/cache@v6
        with:
          path: .bench-cache
          key: cgswitch-bench-${{ runner.os }}
      - name: 运行热路径基准
        shell: bash
        working-directory: src-tauri
        run: cargo bench --bench config_bench -- --warm-up-time 1 --measurement-time 2 --output-format bencher --color never --noplot 2>&1 | tee output.txt
      - name: 对比基准结果
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: cgswitch-core-hotpath
          tool: cargo
          output-file-path: src-tauri/output.txt
          external-data-json-path: .bench-cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: false
          alert-threshold: '200%'
          fail-on-alert: false
          comment-on-alert: true
          summary-always: true
