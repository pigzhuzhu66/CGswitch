name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README*'
      - 'docs/**'
      - '*.md'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - 'README*'
      - 'docs/**'
      - '*.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + fmt + clippy + test
    # 打包验证移到 release.yml（发布时才对 3 个平台构建），CI 只跑能查出项目问题的检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup component add rustfmt clippy
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
  test-macos:
    name: macOS cargo test
    # 保险：覆盖 macOS 平台编译兼容性（不打包），避免编译问题积压到发布才发现
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
