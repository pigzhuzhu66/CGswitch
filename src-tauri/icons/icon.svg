<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CGswitch</title>
  <desc id="desc">The CGswitch mark in a rounded desktop icon container.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cgswitch="https://github.com/zeno528/CGSwitch/ns#">
      <rdf:Description rdf:about="">
        <dc:title>CGswitch Logo</dc:title>
        <dc:creator>zeno528 (Scott Z)</dc:creator>
        <dc:description>AI-assisted design, selected and edited by zeno528 (Scott Z) using Photoshop and SVG tools.</dc:description>
        <dc:rights>Brand asset usage is described in the CGswitch Logo usage policy.</dc:rights>
        <dc:date>2026</dc:date>
        <dc:language>zh-CN</dc:language>
        <cgswitch:policy rdf:resource="https://github.com/zeno528/CGSwitch"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="surface" x1="0.16" y1="0.08" x2="0.84" y2="0.92">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="container-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="32" result="blur"/>
      <feOffset dy="18" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="shadow-color"/>
      <feComposite in="shadow-color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inner-glow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
